# See https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "npm"
      - "dependencies"
    # 0 disables routine version-update PRs; Dependabot security updates are
    # unaffected by this limit, so only security fixes are opened.
    open-pull-requests-limit: 0
    pull-request-branch-name:
      separator: "-"
    versioning-strategy: auto

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "github-actions"
      - "dependencies"
    open-pull-requests-limit: 5
