name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish --dry-run (nothing is published)'
        type: boolean
        default: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Pushing a tag and then creating its release starts two runs. Queue them so the
# second skips the published version; queue: max stops a newer run replacing a pending one.
concurrency:
  group: publish
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  # npm trusted publishing (OIDC) exchanges this token for a short-lived publish token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The root is a private monorepo, so publish each public workspace and skip
      # versions already on the registry, which keeps re-runs safe.
      - name: Publish workspace packages
        run: |
          set -euo pipefail
          flags=(--access public)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          for dir in packages/*/; do
            pkg="${dir}package.json"
            [ -f "$pkg" ] || continue
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            private=$(node -p "require('./$pkg').private === true")
            if [ "$private" = "true" ]; then
              echo "Skipping private package $name"
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
            else
              echo "Publishing $name@$version ${flags[*]}"
              npm publish -w "$name" "${flags[@]}"
            fi
          done
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # npm tries OIDC first; this token is only the fallback when no trusted publisher is set.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
