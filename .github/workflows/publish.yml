name: Publish Package

on:
  release:
    types: [created]
  # Allow triggering the publish manually (e.g. to release from main without
  # cutting a GitHub Release from an environment that cannot create one). The
  # job already skips versions that are already on the registry.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # The repository root is a private monorepo (`private: true`), so a bare
      # `npm publish` fails. Publish each public workspace package instead, and
      # skip any version already on the registry so re-running the release (or
      # an unchanged supporting package) does not fail the job.
      - name: Publish workspace packages
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            pkg="${dir}package.json"
            [ -f "$pkg" ] || continue
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            private=$(node -p "require('./$pkg').private === true")
            if [ "$private" = "true" ]; then
              echo "Skipping private package $name"
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
            else
              echo "Publishing $name@$version"
              npm publish -w "$name" --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
